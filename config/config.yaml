#Main project configuration.
# Scientific analysis choices and runtime settings are defined here.
# Output paths and shared plotting defaults (fonts, colors, colormaps, layout)
# are defined in the workflow and plotting code.
#
# A complete model run must use one conjoint coding scheme consistently ("effect" or "dummy" (dummy not tested yet)).

# Project definition and input survey files
project:
  output_root: results
data:
  raw:
    S0: resources/Survey_Adaptation Natural Hazards_First Wave_raw data.csv
    S1: resources/Survey_Adaptation Natural Hazards_Second Wave_raw data.csv
  id_mapping:
    path: resources/id_list.csv
    sep: ;
    mapping_keys:
      S0: S0_idx
      S1: S1_idx
    wave_keys:
      S0: id
      S1: m
    respondent_id_column: null

# MCMC sampling settings used for model estimation
sampling:
  draws: 1500                 # Retained posterior draws per chain after tuning (for the main run I used: 1500)
  tune: 1500                  # Warm-up/adaptation draws per chain, which are not retained (for the main run I used: 1500)
  chains: 4                   # Number of independent MCMC chains
  cores: 2                    # Number of MCMC chains sampled concurrently (e.g. 4 chains + 2 cores = 2 chains at a time)
  blas_threads_per_chain: 1   # Numerical-library threads per chain (keep low to avoid oversubscription)
  random_seed: 123            # Random seed for reproducible initialization and MCMC sampling
  target_accept: 0.95         # NUTS target acceptance probability: higher values use smaller step sizes and can help reduce divergences, but increase runtime
  progressbar: true           # Show sampling progress
  log_likelihood: true        # Store pointwise log likelihood, required for LOO model comparison

# Survey cleaning and construction of the respondent-level analysis sample
preprocessing:
  skiprows:  # Non-data rows in the raw survey exports to skip when reading the CSV files
  - 1
  - 2
  quality: # Respondent-level quality filters based on attention checks, straightlining, and shared IP addresses
    attention_column: attention_check
    attention_valid_value: Agree
    max_ids_per_ip: 2 # only 2 survey responses from same ip address
    # Straightliner exclusion:
    straightliner_mode: deservingness # = deservingness items only OR
                      # "medium"        = deservingness, identity, and GAL-TAN items OR 
                      # "all"           = all configured Likert groups, including NH sensitivity and psychological distance
  duration: # Exclude unusually short/long completion times using wave-specific duration quantiles
    S0:
      lower_quantile: 0.05
      upper_quantile: 0.95
    S1:
      lower_quantile: 0.05
      upper_quantile: null # No upper-duration exclusion for S1
  
  # For latent construct creation: within-construct item imputation followed by cross-wave fallback for
  # natural-hazard and financial-vulnerability items.
  imputation:
    method: median
    likert_min: 1
    likert_max: 6
    min_items:
      sensitivity_nh: 2
      psychological_distance: 2
      financial_vulnerability: 1
  # Maximum number of tasks in which the preferred option may receive a lower acceptance rating than the non-preferred option.
  acceptance_consistency:
    max_inconsistent_tasks: 2

# Wave-independent item names used during preprocessing and imputation
# Wave prefixes (S0_/S1_) are added by the preprocessing code
analysis_items:
  sensitivity_nh:
  - sensitivity_nh_1
  - sensitivity_nh_2
  - sensitivity_nh_3
  financial_vulnerability:
  - finan_vulnerability_1
  psychological_distance:
  - psycho_distance_1
  - psycho_distance_2
  - psycho_distance_4

# Conjoint preparation
conjoint:
  coding: effect # "effect" or "dummy":  Main thesis analyses use effect coding. IMPORTANT: The dummy coding is not yet finally tested. Use one coding consitently within one run.
  # Effect coding: baseline coefficient is reconstructed from the non-baseline coefficients.
  # Dummy coding: baseline coefficient is fixed at zero.
  left_option: 1
  right_option: 2
  # All possible attribute levels of the conjoint experiment and the omitted baseline level.
  attributes:
    costs:
      baseline: All people pay the same amount
      levels:
      - All people pay the same amount
      - People pay proportionally to their income
      - People & companies being protected by protective measures
      - People pay proportionally to their CO2 emissions
      - Companies pay proportionally to their CO2 emissions
    exemptions:
      baseline: No groups exempted from costs
      levels:
      - No groups exempted from costs
      - Low-income earners exempted from costs
      - Low- and middle-income earners exempted from costs
    benefits:
      baseline: Equal protection levels for all municipalities
      levels:
      - Equal protection levels for all municipalities
      - Municipalities most affected by natural hazards even if they are economically declining
      - Economically prosperous municipalities
      - Municipalities in which people have lived in for many years should be protected at all costs
      - Culturally valuable municipalities e.g. with historic buildings
  
  # Respondent-level variables retained alongside the conjoint design for sample filtering, subgroup analyses, latent constructs, and plotting
  respondent_columns: 
  - respondent_id
  - respondent_key
  - S0_language_region
  - S0_age
  - S0_gender
  - S0_income
  - S0_education
  - S0_party_choice
  - all_acceptance_consistent
  - n_acceptance_inconsistent
  - S0_sensitivity_nh_1
  - S0_sensitivity_nh_2
  - S0_sensitivity_nh_3
  - S0_finan_vulnerability_1
  - S1_sensitivity_nh_1
  - S1_sensitivity_nh_2
  - S1_sensitivity_nh_3
  - S1_finan_vulnerability_1
  - S1_psycho_distance_1
  - S1_psycho_distance_2
  - S1_psycho_distance_4

# Respondent-level variables used by the HCM:
# NHV and psychological distance are latent constructs measured by multiple items;
# financial vulnerability enters as an observed standardized covariate.
constructs:
  natural_hazard_vulnerability:
  - S0_sensitivity_nh_1
  - S0_sensitivity_nh_2
  - S0_sensitivity_nh_3
  psychological_distance:
  - S1_psycho_distance_1
  - S1_psycho_distance_2
  - S1_psycho_distance_4
  financial_vulnerability: S0_finan_vulnerability_1

# Samples used for the main and robustness model fits.
# The full sample is the default; alternative definitions restrict respondents
# or remove selected conjoint tasks.
samples:
  full:
    type: full
  german:
    type: filter
    column: S0_language_region
    operator: equals
    value: German-speaking region
  older_35:
    type: filter
    column: S0_age
    operator: not_equals
    value: 18 - 34
  high_income:
    type: filter
    column: S0_income
    operator: not_equals
    value: Low
  acceptance_consistent:
    type: filter
    column: all_acceptance_consistent
    operator: is_true
  without_company_pay_prop:
    type: exclude_tasks
    conditions: # Exclude tasks containing the specified company-payment/no-exemption combination
      costs: Companies pay proportionally to their CO2 emissions
      exemptions: No groups exempted from costs

# Model specifications for the main analysis, robustness checks, and lower-complexity benchmark models
models:
  default_runs:
  - main
  runs:
    main:
      sample: full
      include_financial_vulnerability: true
    prior_factor_half:
      sample: full
      prior_factor: 0.5 # Multiply prior scales by 0.5 (stronger regularization)
      include_financial_vulnerability: true
    prior_factor_double:
      sample: full
      prior_factor: 2 # Multiply prior scales by 2 (weaker regularization)
      include_financial_vulnerability: true
    without_fv:  # Compare the full HCM with a specification excluding observed financial vulnerability
      sample: full
      include_financial_vulnerability: false
    german:
      sample: german
      include_financial_vulnerability: true
      sampling:
        target_accept: 0.99 # uses higher target accept 
        init: adapt_diag
    older_35:
      sample: older_35
      include_financial_vulnerability: true
    acceptance_consistent:
      sample: acceptance_consistent
      include_financial_vulnerability: true
    without_company_pay_prop:
      sample: without_company_pay_prop
      include_financial_vulnerability: true
    simple:
      family: simple
      sample: full
    mixed_logit:
      family: mixed_logit
      sample: full

# Posterior interval settings, robustness analyses, and model comparisons
analysis:
  hdi_prob: 0.89 # Report 89% highest-density intervals for posterior estimates
  robustness: # robustness plots based on comparison of main model and the altered models
    prior_sensitivity: # choice of priors test
      runs:
      - main
      - prior_factor_half
      - prior_factor_double
      labels:
        main: Full HCM
        prior_factor_half: Stronger regularizing priors
        prior_factor_double: Less regularizing priors
      quantities:
      - pre
      - shift
    language: # compare only german-speaking subsample with full sample
      runs:
      - main
      - german
      labels:
        main: Full sample
        german: German-speaking region
      quantities:
      - pre
      - shift
      expected_n_respondents:
        main: 526
        german: 316
    age: # compare "older" group sample with full sample
      runs:
      - main
      - older_35
      labels:
        main: Full sample
        older_35: Without age 18-34
      quantities:
      - pre
      - shift
    acceptance: # compare more consitent respondents with full sample (including more inconsistently anwering respondents)
      runs:
      - main
      - acceptance_consistent
      labels:
        main: Full sample
        acceptance_consistent: At most two inconsistent tasks
      quantities:
      - pre
      - shift
    without_fv: # compare a model design exluding financial vulnerability as latent construt with complete model
      runs:
      - main
      - without_fv
      labels:
        main: Full HCM
        without_fv: HCM without FV
      quantities:
      - pre
      - shift
    without_company_pay_prop: # compare subsmple without choices including companies pay proportionally to their co2 emissions with full sample 
      runs:
      - main
      - without_company_pay_prop
      labels:
        main: Full design
        without_company_pay_prop: Company/no-exemption tasks excluded
      quantities:
      - pre
      - shift
      exclude_levels:
        costs:
        - Companies pay proportionally to their CO2 emissions
      recenter_selected_levels: true
  comparisons: # different model complexities (simple choice model, mixed_logit model (time variant) and hybrid choice model (including latent factors on with, one without FV))
    choice_baselines:
    - main
    - simple
    - mixed_logit
    - without_fv


# plot specifications
plots:
  # comparison of survey responses in the pre and post Blatten
  pre_post_distributions:
    distribution-climate-likert:
      title: 'Climate-change risk perception: pre vs. post'
      items:
      - climatechange_nh_1
      - climatechange_nh_2
      - climatechange_nh_3
      labels:
        climatechange_nh_1: In municipality
        climatechange_nh_2: In canton
        climatechange_nh_3: In Switzerland
    distribution-nh-likert:
      title: 'Natural-hazard vulnerability: pre vs. post'
      items:
      - sensitivity_nh_1
      - sensitivity_nh_2
      - sensitivity_nh_3
      labels:
        sensitivity_nh_1: Personally
        sensitivity_nh_2: For family
        sensitivity_nh_3: For municipality
  hypotheses:
    H1-pre-post-shift:
      hypothesis: H1
    H2-psychological-distance:
      hypothesis: H2
    H3-financial-vulnerability:
      hypothesis: H3
    H4-vulnerability-heatmap: 
      hypothesis: H4
      levels:
        # Only uncommented levels are included in the H4 heatmap.
        costs:
          # - All people pay the same amount
          # - People pay proportionally to their income
          - People & companies being protected by protective measures
          # - People pay proportionally to their CO2 emissions
          # - Companies pay proportionally to their CO2 emissions
        exemptions:
          # - No groups exempted from costs
          # - Low-income earners exempted from costs
          # - Low- and middle-income earners exempted from costs
        benefits:
          - Equal protection levels for all municipalities
          - Municipalities most affected by natural hazards even if they are economically declining
          # - Economically prosperous municipalities
          # - Municipalities in which people have lived in for many years should be protected at all costs
          # - Culturally valuable municipalities e.g. with historic buildings
      quantity: shift # Plot the event-related utility shift ("pre", "post", or "shift")


# Geographic inputs and respondent-to-municipality/canton assignment
geography:
  boundaries: resources/swissBOUNDARIES3D_1_5_LV95_LN02.gpkg
  localities: resources/AMTOVZ_CSV_WGS84.csv
  locality_sep: ;
  municipality_layer: tlm_hoheitsgebiet
  canton_layer: tlm_kantonsgebiet
  locality_columns:
    postal_code: PLZ4
    municipality: BFS-Nr
    locality: Ortschaftsname
  municipality_columns:
    municipality: bfs_nummer
    canton: kantonsnummer
  canton_columns:
    canton: kantonsnummer
    name: name
  respondent_postal_column: S0_postal_code_1_TEXT
  small_sample_threshold: 20 # Minimum canton sample size required for displaying survey/posterior summaries

  event_marker: # Blatten location
    longitude: 7.816378462880258
    latitude: 46.41984127890122
    label: Blatten


# Definitions of the plotted maps
maps:
  survey_source: analysis
  # Survey answers directly plotted as map
  survey:
    respondent_count:
      type: count # Number of respondents per canton
      label: Respondents in analysis sample
      vmin: 0
    blatten_solidarity:
      type: survey # Aggregate observed survey variables by canton
      columns:
      - S1_donated_blatten
      - S1_volunteered_blatten
      operation: any
      label: Donation of money or time for Blatten
      vmin: 0
      vmax: 1
      vcenter: 0.5
    prosocial_any:
      type: survey # Aggregate observed survey variables by canton
      columns:
      - S1_donated_blatten
      - S1_volunteered_blatten
      - S1_donated_other
      - S1_volunteered_other
      operation: any
      label: Donation or volunteering
      vmin: 0
      vmax: 1
      vcenter: 0.5
  
  # Posterior results plotted as map 
  posterior:
    costs_shift:
      type: utility # Aggregate respondent-specific posterior utility quantities by canton
      run: main
      attribute: costs
      quantity: shift
      title: Costs
      colorbar_label: Shift utility
      center_zero: true
    exemptions_shift:
      type: utility # Aggregate respondent-specific posterior utility quantities by canton
      run: main
      attribute: exemptions
      quantity: shift
      title: Exemptions
      colorbar_label: Shift utility
      center_zero: true
    benefits_shift:
      type: utility # Aggregate respondent-specific posterior utility quantities by canton
      run: main
      attribute: benefits
      quantity: shift
      title: Benefits
      colorbar_label: Shift utility
      center_zero: true
    eta_nhv:
      type: trait  # Aggregate respondent-specific latent-trait estimates by canton
      run: main
      variable: eta_nhv
      label: Mean latent natural-hazard vulnerability
      colorbar_label: Mean latent natural-hazard vulnerability
      center_zero: true
    eta_pd:
      type: trait  # Aggregate respondent-specific latent-trait estimates by canton
      run: main
      variable: eta_pd
      label: Mean latent psychological closeness
      colorbar_label: Mean latent psychological closeness
      center_zero: true
