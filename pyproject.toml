[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "natural-hazard-solidarity"
version = "0.2.0"
description = "Legacy-faithful Snakemake migration for the conjoint experiment"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "xarray", "scipy", "matplotlib"]

[project.optional-dependencies]
model = ["pymc>=5.25,<6", "arviz>=0.21,<1", "pyarrow", "h5netcdf"]
geo = ["geopandas", "pyogrio", "shapely"]
test = ["pytest", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
