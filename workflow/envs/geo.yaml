# Deliberately separate: adding GeoPandas should not change the model environment.
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - numpy>=1.26,<3
  - pandas=2.2.*
  - scipy
  - pyarrow
  - matplotlib
  - xarray
  - arviz=0.23.4
  - h5netcdf
  - h5py
  - geopandas=1.1.*
  - pyogrio
  - shapely
  - pytest
  - pyyaml
